<!DOCTYPE html>
<html>
<head>
    <title>PDF in HTML</title>
</head>

<style>
        /* Remove default browser margins and padding */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents double scrollbars */
        }

        /* Force the PDF to stretch to all corners of the screen */
        .fullscreen-pdf {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
        }
    </style>
<body>
    <div style="width: 800px; height: 600px;">
        <iframe class="fullscreen-pdf"
                src="{{ url_for('static', filename='Wickermoor_Village_Map.pdf') }}" 
                width="100%" 
                height="100%">
        </iframe>
    </div>
</body>
</html>
